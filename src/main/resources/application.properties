spring.application.name=FamilyApp

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/familyapp
spring.datasource.username=postgres
spring.datasource.password=postgres

# Hibernate
# with validate, it would crash with flyway, database management is delegated to flyway
# validate checks that entities match actual database structure
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration